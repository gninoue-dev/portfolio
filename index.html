<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dev Gninoue — Portfolio</title>
  <meta name="description" content="Portfolio de Gninoue Jean-Marc (Dev Gninoue) : développeur Full Stack junior, créateur de jeux vidéo et monteur vidéo.">
  <meta name="theme-color" content="#060B16">
  <meta property="og:title" content="Dev Gninoue — Portfolio">
  <meta property="og:description" content="Développeur Full Stack junior, créateur de jeux vidéo et monteur vidéo. Trois thèmes, dont un jeu jouable.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="res/photo-profil-720.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060B16'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='28' font-weight='700' text-anchor='middle' fill='%237FC1FF'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/commun.css">
  <!-- Les CSS et JS de chaque thème sont chargés à la demande par js/commun.js -->
</head>

<body data-theme="professionnel" class="chargement">

  <a href="#zoneTheme" class="lien-evitement" data-i18n="commun.aller-contenu">Aller au contenu</a>

  <header class="entete-site" id="enteteSite">
    <div class="entete-conteneur">

      <a href="#accueil" class="logo" aria-label="Dev Gninoue">
        <span class="logo-crochet">&lt;</span><span class="logo-texte">Dev<span
            class="logo-point">.</span>Gninoue</span><span class="logo-curseur">|</span><span
          class="logo-crochet">/&gt;</span>
      </a>

      <button class="bouton-menu" id="boutonMenu" aria-controls="navPrincipale" aria-expanded="false"
        data-i18n-aria="commun.ouvrir-menu">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav-principale" id="navPrincipale" data-i18n-aria="commun.nav-principale">
        <ul class="liens-nav">
          <li><a href="#apropos" class="lien-nav" data-section="apropos"><span class="index-nav">01</span><span
                data-i18n="nav.apropos"></span></a></li>
          <li><a href="#competences" class="lien-nav" data-section="competences"><span class="index-nav">02</span><span
                data-i18n="nav.competences"></span></a></li>
          <li><a href="#projets" class="lien-nav" data-section="projets"><span class="index-nav">03</span><span
                data-i18n="nav.projets"></span></a></li>
          <li><a href="#contact" class="lien-nav" data-section="contact"><span class="index-nav">04</span><span
                data-i18n="nav.contact"></span></a></li>
        </ul>

        <div class="controles-nav">

          <div class="menu-deroulant" id="menuLangue">
            <button class="bouton-controle" id="boutonLangue" aria-haspopup="true" aria-expanded="false"
              data-i18n-aria="commun.choisir-langue">
              <i class="fa-solid fa-globe icone-controle" aria-hidden="true"></i>
              <span id="langueActuelle">FR</span>
              <i class="fa-solid fa-chevron-down chevron" aria-hidden="true"></i>
            </button>
            <ul class="liste-deroulante">
              <li><button data-langue="fr" class="option-deroulante" lang="fr">Français</button></li>
              <li><button data-langue="en" class="option-deroulante" lang="en">English</button></li>
            </ul>
          </div>

          <div class="menu-deroulant" id="menuTheme">
            <button class="bouton-controle" id="boutonTheme" aria-haspopup="true" aria-expanded="false"
              data-i18n-aria="commun.choisir-theme">
              <i class="fa-solid fa-palette icone-controle" aria-hidden="true"></i>
              <span id="themeActuel"></span>
              <i class="fa-solid fa-chevron-down chevron" aria-hidden="true"></i>
            </button>
            <ul class="liste-deroulante">
              <li><button data-choix-theme="professionnel" class="option-deroulante"><i class="fa-solid fa-briefcase"
                    aria-hidden="true"></i><span data-i18n="theme.professionnel"></span></button></li>
              <li><button data-choix-theme="gaming" class="option-deroulante"><i class="fa-solid fa-gamepad"
                    aria-hidden="true"></i><span data-i18n="theme.gaming"></span></button></li>
              <li><button data-choix-theme="personnel" class="option-deroulante"><i class="fa-solid fa-bolt"
                    aria-hidden="true"></i><span data-i18n="theme.personnel"></span></button></li>
            </ul>
          </div>

        </div>
      </nav>

    </div>
    <div class="lueur-entete"></div>
  </header>

  <!-- Zone remplie par le thème actif -->
  <main id="zoneTheme" tabindex="-1">
    <noscript>
      <div class="sans-script">
        <h1>Gninoue Jean-Marc — Développeur Full Stack junior</h1>
        <p>Ce portfolio a besoin de JavaScript. Retrouvez mes projets sur
          <a href="https://github.com/gninoue-dev">github.com/gninoue-dev</a> ou écrivez-moi à
          devgninoue@gmail.com.
        </p>
      </div>
    </noscript>
  </main>

  <footer class="pied-page" id="piedPage">
    <div class="pied-conteneur">

      <div class="pied-haut">
        <a href="#accueil" class="logo pied-logo" aria-label="Dev Gninoue">
          <span class="logo-crochet">&lt;</span><span class="logo-texte">Dev<span
              class="logo-point">.</span>Gninoue</span><span class="logo-curseur">|</span><span
            class="logo-crochet">/&gt;</span>
        </a>
        <div data-zone-cv="bouton-action bouton-principal"></div>
      </div>

      <div class="pied-milieu">
        <nav class="pied-liens" data-i18n-aria="commun.nav-pied">
          <a href="#accueil" data-section="accueil" data-i18n="nav.accueil"></a>
          <a href="#apropos" data-section="apropos" data-i18n="nav.apropos"></a>
          <a href="#competences" data-section="competences" data-i18n="nav.competences"></a>
          <a href="#projets" data-section="projets" data-i18n="nav.projets"></a>
          <a href="#contact" data-section="contact" data-i18n="nav.contact"></a>
        </nav>
        <div class="pied-reseaux" id="piedReseaux"></div>
      </div>

      <div class="pied-bas">
        <p>&copy; <span id="anneeCourante"></span> Gninoue Jean-Marc — <span data-i18n="footer.droits"></span></p>
        <p class="pied-credits" id="piedCredits"></p>
      </div>

    </div>
  </footer>

  <a href="#" target="_blank" rel="noopener" class="bulle-whatsapp" id="bulleWhatsapp"
    data-i18n-aria="commun.whatsapp">
    <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
    <span class="anneau-pulse"></span>
  </a>

  <!-- Voile de transition entre deux thèmes -->
  <div class="voile-theme" id="voileTheme" aria-hidden="true">
    <span class="voile-chargeur"></span>
  </div>
  <p class="annonce-lecteur" id="annonceLecteur" aria-live="polite"></p>

  <script src="js/donnees.js"></script>
  <script src="js/traductions.js"></script>
  <script src="js/commun.js"></script>
</body>

</html>
